services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: 
      - "${DB_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"']
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  sqlserver-data: